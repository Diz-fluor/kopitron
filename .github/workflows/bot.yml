name: Публикация бота

on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Публикуем воркер и кладём токен бота
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          echo "$BOT_TOKEN" | npx --yes wrangler@4 secret put BOT_TOKEN
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Подключаем вебхук Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          SECRET=$(printf '%s' "$BOT_TOKEN" | sha256sum | cut -c1-32)
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -d "url=${URL}/telegram" \
            -d "secret_token=${SECRET}" \
            -d 'allowed_updates=["message","callback_query"]' | grep -q '"ok":true'
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setMyCommands" \
            -H 'content-type: application/json' \
            -d '{"commands":[{"command":"start","description":"Начать"},{"command":"remind","description":"Показать напоминание"}]}' > /dev/null
          echo "Вебхук: ${URL}/telegram"
